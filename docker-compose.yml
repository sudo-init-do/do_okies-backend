services:
  postgres:
    image: postgres:15
    container_name: okies_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: okies_redis
    restart: always
    ports:
      - "6379:6379"

  # --- Dev API (with Air hot reload) ---
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: okies_api
    command: air -c /app/.air.toml   
    working_dir: /app/apps/api       
    volumes:
      - .:/app
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_ADDR=${REDIS_ADDR}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  # --- Prod API (compiled binary, optional) ---
  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: okies_api_prod
    environment:
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_ADDR=${REDIS_ADDR}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    profiles: ["prod"]

  migrator:
    image: migrate/migrate:v4.17.0
    container_name: okies_migrator
    entrypoint: [""]
    volumes:
      - ./infra/migrations:/migrations
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    profiles: ["migrate"]

volumes:
  pgdata: {}
